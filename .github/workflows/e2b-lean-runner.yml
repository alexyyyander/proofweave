name: Proofweave GitHub isolation diagnostics

on:
  workflow_dispatch:

concurrency:
  group: proofweave-github-isolation-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

# This legacy filename no longer contains a recovery Runner. The workflow has
# no Environment, no production secret, no queue authority, and no E2B client.
# Keep it disabled on GitHub. Operators run hosted recovery from the local
# operator tooling documented in docs/runner-provider-neutral-deployment.md.
jobs:
  verify-zero-secret-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked diagnostic dependencies
        run: npm ci --ignore-scripts

      - name: Verify the checked-in GitHub isolation closure
        run: npm run runtime:recovery-isolation:check

      - name: Record the non-execution boundary
        run: echo "Diagnostic only — no production Environment, Turso queue, or E2B authority." >> "$GITHUB_STEP_SUMMARY"
