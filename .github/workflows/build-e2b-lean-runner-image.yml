name: Build Proofweave reviewed Lean Runner image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Exact reviewed Lean environment to build
        required: true
        default: core-4.27
        type: choice
        options:
          - core-4.27
          - mathlib-4.27-a3a10
          - mathlib-4.31-9a948

permissions:
  contents: read

concurrency:
  group: proofweave-reviewed-lean-runner-image
  # A newer manually reviewed image build supersedes an older queued or running
  # one. E2B template creation is deliberately outside GitHub.
  cancel-in-progress: true

env:
  NODE_BASE_IMAGE: node@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37
  BASE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proofweave-lean-base
  RUNNER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proofweave-lean-runner

jobs:
  build-and-inspect:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    # A cold, checksum-bound Mathlib closure can exceed 90 minutes while Lake
    # downloads the exact cache and BuildKit publishes its SBOM/provenance.
    # Keep the verification gates unchanged and give this image-build-only job
    # enough time to finish on a fresh GitHub-hosted runner.
    timeout-minutes: 180
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select the exact reviewed environment
        id: profile
        env:
          SELECTED_PROFILE: ${{ inputs.profile }}
        run: |
          case "$SELECTED_PROFILE" in
            core-4.27)
              echo "profile=core-4.27" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.core-alpha-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.27.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=none" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.27.0/lean-4.27.0-linux.zip" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=0a62138ea5b9880a8eccd5e88d0920f93a58cf3428a9c78f99b8f4316383c69b" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.27.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            mathlib-4.27-a3a10)
              echo "profile=mathlib-4.27-a3a10" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.mathlib-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.27.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=a3a10db0e9d66acbebf76c5e6a135066525ac900" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.27.0/lean-4.27.0-linux.tar.zst" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=056e2dc8564fc064a801e69f3eb18c044b9b546bc8b0e5a2c00247f8a1cb8ce6" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.27.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            mathlib-4.31-9a948)
              echo "profile=mathlib-4.31-9a948" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.mathlib-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.31.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=9a9483a92959bc92bd6a60176dd1fe597298c1f8" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.31.0/lean-4.31.0-linux.tar.zst" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=07a633cc8d9151cbc08825ea4cdda50d4b02a2c9cb852c0131b13046f49cad7f" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.31.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported reviewed profile" >&2
              exit 1
              ;;
          esac

      # The checksum-bound Mathlib cache is much larger than the tools used by
      # this single-purpose job. GitHub's hosted image also includes Android,
      # .NET, GHC, Ruby, PyPy, and CodeQL toolchains that are never executed
      # here. Remove only those preinstalled directories before BuildKit starts
      # so the public Mathlib closure and its image metadata fit on disk.
      - name: Reclaim hosted-runner disk for the Mathlib closure
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy
          docker system prune --all --force
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up the attestation-capable Buildx builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          driver: docker-container

      - name: Build and publish the checksum-bound Lean base
        id: base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ steps.profile.outputs.base_dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-${{ steps.profile.outputs.profile }}
          build-args: |
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            EXPECTED_LEAN_TOOLCHAIN=${{ steps.profile.outputs.lean_toolchain }}
            EXPECTED_MATHLIB_REVISION=${{ steps.profile.outputs.mathlib_revision }}
            LEAN_RELEASE_URL=${{ steps.profile.outputs.lean_release_url }}
            LEAN_RELEASE_SHA256=${{ steps.profile.outputs.lean_release_sha256 }}
            LEAN_ARCHIVE_ROOT=${{ steps.profile.outputs.lean_archive_root }}

      - name: Assemble and publish the credential-free Runner
        id: runner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: services/lean-runner/Dockerfile
          platforms: linux/amd64
          network: none
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.RUNNER_IMAGE_NAME }}:${{ github.sha }}-${{ steps.profile.outputs.profile }}
          build-args: |
            RUNNER_BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}@${{ steps.base.outputs.digest }}
            EXPECTED_LEAN_TOOLCHAIN=${{ steps.profile.outputs.lean_toolchain }}
            EXPECTED_MATHLIB_REVISION=${{ steps.profile.outputs.mathlib_revision }}

      # Mathlib's compiled closure is intentionally large. The pushed image is
      # immutable at this point, so discard BuildKit's duplicate local layers
      # before Docker pulls that image back for the separate offline smoke run.
      - name: Reclaim build cache before the offline image pull
        run: |
          docker buildx du
          docker buildx prune --all --force
          docker system df

      - name: Exercise the final image without network access
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
          LEAN_TOOLCHAIN: ${{ steps.profile.outputs.lean_toolchain }}
          MATHLIB_REVISION: ${{ steps.profile.outputs.mathlib_revision }}
        run: >-
          docker run --rm --network=none --cpus=2 --memory=2g
          --pids-limit=128 --tmpfs /tmp/proofweave:rw,nosuid,nodev,size=1g,mode=1777
          -e EXPECTED_LEAN_TOOLCHAIN="$LEAN_TOOLCHAIN"
          -e EXPECTED_MATHLIB_REVISION="$MATHLIB_REVISION"
          --entrypoint node "$FINAL_RUNNER_IMAGE"
          /opt/proofweave/services/lean-runner/inspect-image-environment.mjs

      - name: Attest the final Runner image in GitHub when supported
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.RUNNER_IMAGE_NAME }}
          subject-digest: ${{ steps.runner.outputs.digest }}
          push-to-registry: true

      - name: Record the private-repository attestation boundary
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "GitHub artifact attestations are unavailable for user-owned private repositories." >> "$GITHUB_STEP_SUMMARY"
          echo "The registry-attached BuildKit SBOM and provenance remain the published image evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable image coordinates
        id: coordinates
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
        run: |
          echo "runner_image=$FINAL_RUNNER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Proofweave reviewed Lean Runner" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "PROOFWEAVE_E2B_RUNNER_IMAGE=$FINAL_RUNNER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "leanToolchain=${{ steps.profile.outputs.lean_toolchain }}" >> "$GITHUB_STEP_SUMMARY"
          echo "mathlibRevision=${{ steps.profile.outputs.mathlib_revision }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
