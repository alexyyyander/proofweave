name: Build Proofweave Lean Core alpha image

on:
  workflow_dispatch:
    inputs:
      build_e2b_template:
        description: Build the private E2B template after publishing the reviewed image
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: proofweave-lean-core-alpha-image
  cancel-in-progress: false

env:
  NODE_BASE_IMAGE: node@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37
  LEAN_TOOLCHAIN: leanprover/lean4:v4.27.0
  MATHLIB_REVISION: none
  LEAN_RELEASE_URL: https://github.com/leanprover/lean4/releases/download/v4.27.0/lean-4.27.0-linux.zip
  LEAN_RELEASE_SHA256: 0a62138ea5b9880a8eccd5e88d0920f93a58cf3428a9c78f99b8f4316383c69b
  LEAN_ARCHIVE_ROOT: lean-4.27.0-linux
  BASE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proofweave-lean-core-base
  RUNNER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proofweave-lean-runner

jobs:
  build-and-inspect:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: proofweave-runner-alpha
    outputs:
      runner_image: ${{ steps.coordinates.outputs.runner_image }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up the attestation-capable Buildx builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          driver: docker-container

      - name: Build and publish the checksum-bound Lean base
        id: base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: services/lean-runner/Dockerfile.core-alpha-base
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            EXPECTED_LEAN_TOOLCHAIN=${{ env.LEAN_TOOLCHAIN }}
            EXPECTED_MATHLIB_REVISION=${{ env.MATHLIB_REVISION }}
            LEAN_RELEASE_URL=${{ env.LEAN_RELEASE_URL }}
            LEAN_RELEASE_SHA256=${{ env.LEAN_RELEASE_SHA256 }}
            LEAN_ARCHIVE_ROOT=${{ env.LEAN_ARCHIVE_ROOT }}

      - name: Assemble and publish the credential-free Runner
        id: runner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: services/lean-runner/Dockerfile
          platforms: linux/amd64
          network: none
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.RUNNER_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            RUNNER_BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}@${{ steps.base.outputs.digest }}
            EXPECTED_LEAN_TOOLCHAIN=${{ env.LEAN_TOOLCHAIN }}
            EXPECTED_MATHLIB_REVISION=${{ env.MATHLIB_REVISION }}

      - name: Exercise the final image without network access
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
        run: >-
          docker run --rm --read-only --network=none --cpus=1 --memory=2g
          --pids-limit=128 --tmpfs /tmp/proofweave:rw,nosuid,nodev,size=1g
          --entrypoint /bin/sh "$FINAL_RUNNER_IMAGE" -c
          'node --version && lean --version && lake --version'

      - name: Attest the final Runner image in GitHub when supported
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.RUNNER_IMAGE_NAME }}
          subject-digest: ${{ steps.runner.outputs.digest }}
          push-to-registry: true

      - name: Record the private-repository attestation boundary
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "GitHub artifact attestations are unavailable for user-owned private repositories." >> "$GITHUB_STEP_SUMMARY"
          echo "The registry-attached BuildKit SBOM and provenance remain the published image evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable image coordinates
        id: coordinates
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
        run: |
          echo "runner_image=$FINAL_RUNNER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Proofweave Lean Core alpha" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "PROOFWEAVE_E2B_RUNNER_IMAGE=$FINAL_RUNNER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "leanToolchain=${LEAN_TOOLCHAIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "mathlibRevision=${MATHLIB_REVISION}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-e2b-template:
    if: ${{ inputs.build_e2b_template }}
    needs: build-and-inspect
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: proofweave-runner-alpha
    steps:
      - name: Check out the reviewed template builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      # This job has packages:read only. Its short-lived GITHUB_TOKEN lets E2B
      # import the private image without exposing the package-write token used
      # by the separate publication job or requiring a long-lived package PAT.
      - name: Build the E2B template from the immutable private image
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          PROOFWEAVE_E2B_RUNNER_IMAGE: ${{ needs.build-and-inspect.outputs.runner_image }}
          PROOFWEAVE_E2B_TEMPLATE_NAME: proofweave-lean-core-alpha:${{ github.sha }}
          PROOFWEAVE_E2B_CPU: "2"
          PROOFWEAVE_E2B_MEMORY_MB: "2048"
          PROOFWEAVE_E2B_REGISTRY_USERNAME: ${{ github.actor }}
          PROOFWEAVE_E2B_REGISTRY_PASSWORD: ${{ github.token }}
        run: npm run runner:e2b:template:build
