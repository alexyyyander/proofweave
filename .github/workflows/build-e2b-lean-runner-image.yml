name: Build Proofweave reviewed Lean Runner image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Exact reviewed Lean environment to build
        required: true
        default: mathlib-4.35-56a00
        type: choice
        options:
          - mathlib-4.35-56a00
          - core-4.27
          - mathlib-4.27-a3a10
          - mathlib-4.31-9a948

permissions:
  contents: read

concurrency:
  group: proofweave-reviewed-lean-runner-image
  # Preserve an existing build; publishing a candidate must not cancel another
  # reviewed build. E2B template creation is deliberately outside GitHub.
  cancel-in-progress: false

env:
  # Docker Official Image node:22.23.4-bookworm, verified for linux/amd64.
  NODE_BASE_IMAGE: node@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  # E2B-supported Rocky 9 minimal, linux/amd64; no x86-64-v3 requirement.
  RUNTIME_BASE_IMAGE: rockylinux/rockylinux@sha256:8c5ffaa82079057f9d5206379996763a491f0cea9ef0e27c1395557ecd0f5bef
  EXPECTED_NODE_VERSION: 22.23.4
  BASE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proofweave-lean-base
  RUNNER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proofweave-lean-runner

jobs:
  build-and-inspect:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    # A cold, checksum-bound Mathlib closure can exceed 90 minutes while Lake
    # downloads the exact cache and BuildKit publishes its SBOM/provenance.
    # Keep the verification gates unchanged and give this image-build-only job
    # enough time to finish on a fresh GitHub-hosted runner.
    timeout-minutes: 180
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select the exact reviewed environment
        id: profile
        env:
          SELECTED_PROFILE: ${{ inputs.profile }}
        run: |
          case "$SELECTED_PROFILE" in
            mathlib-4.35-56a00)
              echo "profile=mathlib-4.35-56a00" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.mathlib-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.35.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=56a005855ea17e0b0958f73ec801ae140b0a1679" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.35.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            core-4.27)
              echo "profile=core-4.27" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.core-alpha-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.27.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=none" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.27.0/lean-4.27.0-linux.zip" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=0a62138ea5b9880a8eccd5e88d0920f93a58cf3428a9c78f99b8f4316383c69b" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.27.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            mathlib-4.27-a3a10)
              echo "profile=mathlib-4.27-a3a10" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.mathlib-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.27.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=a3a10db0e9d66acbebf76c5e6a135066525ac900" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.27.0/lean-4.27.0-linux.tar.zst" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=056e2dc8564fc064a801e69f3eb18c044b9b546bc8b0e5a2c00247f8a1cb8ce6" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.27.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            mathlib-4.31-9a948)
              echo "profile=mathlib-4.31-9a948" >> "$GITHUB_OUTPUT"
              echo "base_dockerfile=services/lean-runner/Dockerfile.mathlib-base" >> "$GITHUB_OUTPUT"
              echo "lean_toolchain=leanprover/lean4:v4.31.0" >> "$GITHUB_OUTPUT"
              echo "mathlib_revision=9a9483a92959bc92bd6a60176dd1fe597298c1f8" >> "$GITHUB_OUTPUT"
              echo "lean_release_url=https://github.com/leanprover/lean4/releases/download/v4.31.0/lean-4.31.0-linux.tar.zst" >> "$GITHUB_OUTPUT"
              echo "lean_release_sha256=07a633cc8d9151cbc08825ea4cdda50d4b02a2c9cb852c0131b13046f49cad7f" >> "$GITHUB_OUTPUT"
              echo "lean_archive_root=lean-4.31.0-linux" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported reviewed profile" >&2
              exit 1
              ;;
          esac

      # The checksum-bound Mathlib cache is much larger than the tools used by
      # this single-purpose job. GitHub's hosted image also includes Android,
      # .NET, GHC, Ruby, PyPy, and CodeQL toolchains that are never executed
      # here. Remove only those preinstalled directories before BuildKit starts
      # so the public Mathlib closure and its image metadata fit on disk.
      - name: Reclaim hosted-runner disk for the Mathlib closure
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy
          docker system prune --all --force
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up the attestation-capable Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker-container

      - name: Install the checksum-pinned vulnerability scanner
        run: |
          mkdir -p "$RUNNER_TEMP/proofweave-trivy" runner-image-evidence
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/proofweave-trivy/trivy.tar.gz"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/proofweave-trivy/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/proofweave-trivy/trivy.tar.gz" -C "$RUNNER_TEMP/proofweave-trivy" trivy

      - name: Inspect the minimal execution runtime before building Lean
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-image-evidence
          docker buildx build --load --platform linux/amd64 --target minimal-runtime \
            --file "${{ steps.profile.outputs.base_dockerfile }}" \
            --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" \
            --build-arg RUNTIME_BASE_IMAGE="$RUNTIME_BASE_IMAGE" \
            --build-arg EXPECTED_NODE_VERSION="$EXPECTED_NODE_VERSION" \
            --tag proofweave-runtime:inspection . 2>&1 | tee runner-image-evidence/runtime-build.log
          docker run --rm --network=none --cpus=1 --memory=512m --pids-limit=128 --user proofweave \
            --entrypoint node proofweave-runtime:inspection --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              import { assertMinimalRuntimeTools, assertSupportedExecutionDistro } from "/opt/proofweave/services/lean-runner/runtime-tool-policy.mjs";
              assertMinimalRuntimeTools(process.env.PATH);
              assertSupportedExecutionDistro(readFileSync("/etc/os-release", "utf8"));
              assert.equal(process.getuid(), 10001);
              assert.equal(process.versions.node, "22.23.4");
              console.log("runtime-offline-smoke: distro, Node, non-root and tool minimization passed");
            ' | tee runner-image-evidence/runtime-smoke.log
          export RUNTIME_IMAGE_ID="$(docker image inspect proofweave-runtime:inspection --format '{{.Id}}')"
          "$RUNNER_TEMP/proofweave-trivy/trivy" image --image-src docker \
            --scanners vuln --list-all-pkgs --timeout 20m --format json \
            --output runner-image-evidence/runtime-trivy.json proofweave-runtime:inspection
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const bytes = readFileSync("runner-image-evidence/runtime-trivy.json");
            const report = JSON.parse(bytes);
            if (!report.Results?.length || report.Metadata?.ImageID !== process.env.RUNTIME_IMAGE_ID) throw new Error("Missing or mismatched runtime scan evidence.");
            const blocking = report.Results.flatMap(result => result.Vulnerabilities ?? []).filter(item => ["HIGH", "CRITICAL"].includes(item.Severity));
            const evidence = { sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, imageId: process.env.RUNTIME_IMAGE_ID, scanSha256: createHash("sha256").update(bytes).digest("hex"), blockingHighCritical: blocking.length, published: false };
            writeFileSync("runner-image-evidence/runtime-review.json", JSON.stringify(evidence, null, 2) + "\n");
            console.log(JSON.stringify(evidence));
            if (blocking.length) throw new Error("Runtime requires HIGH/CRITICAL vulnerability triage.");
          '

      - name: Build and publish the checksum-bound Lean base
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ steps.profile.outputs.base_dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.BASE_IMAGE_NAME }}:${{ github.sha }}-${{ steps.profile.outputs.profile }}
          build-args: |
            NODE_BASE_IMAGE=${{ env.NODE_BASE_IMAGE }}
            RUNTIME_BASE_IMAGE=${{ env.RUNTIME_BASE_IMAGE }}
            EXPECTED_NODE_VERSION=${{ env.EXPECTED_NODE_VERSION }}
            EXPECTED_LEAN_TOOLCHAIN=${{ steps.profile.outputs.lean_toolchain }}
            EXPECTED_MATHLIB_REVISION=${{ steps.profile.outputs.mathlib_revision }}
            LEAN_RELEASE_URL=${{ steps.profile.outputs.lean_release_url }}
            LEAN_RELEASE_SHA256=${{ steps.profile.outputs.lean_release_sha256 }}
            LEAN_ARCHIVE_ROOT=${{ steps.profile.outputs.lean_archive_root }}

      - name: Assemble and publish the credential-free Runner
        id: runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: services/lean-runner/Dockerfile
          platforms: linux/amd64
          network: none
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.RUNNER_IMAGE_NAME }}:${{ github.sha }}-${{ steps.profile.outputs.profile }}
          build-args: |
            RUNNER_BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}@${{ steps.base.outputs.digest }}
            EXPECTED_NODE_VERSION=${{ env.EXPECTED_NODE_VERSION }}
            EXPECTED_LEAN_TOOLCHAIN=${{ steps.profile.outputs.lean_toolchain }}
            EXPECTED_MATHLIB_REVISION=${{ steps.profile.outputs.mathlib_revision }}

      # Mathlib's compiled closure is intentionally large. The pushed image is
      # immutable at this point, so discard BuildKit's duplicate local layers
      # before Docker pulls that image back for the separate offline smoke run.
      - name: Reclaim build cache before the offline image pull
        run: |
          docker buildx du
          docker buildx prune --all --force
          docker system df

      - name: Exercise the final image without network access
        shell: bash
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
          LEAN_TOOLCHAIN: ${{ steps.profile.outputs.lean_toolchain }}
          MATHLIB_REVISION: ${{ steps.profile.outputs.mathlib_revision }}
        run: |
          set -euo pipefail
          mkdir -p runner-image-evidence
          docker run --rm --network=none --cpus=2 --memory=2g \
            --pids-limit=128 --tmpfs /tmp/proofweave:rw,nosuid,nodev,size=1g,mode=1777 \
            -e EXPECTED_NODE_VERSION="$EXPECTED_NODE_VERSION" \
            -e EXPECTED_LEAN_TOOLCHAIN="$LEAN_TOOLCHAIN" \
            -e EXPECTED_MATHLIB_REVISION="$MATHLIB_REVISION" \
            --entrypoint node "$FINAL_RUNNER_IMAGE" \
            /opt/proofweave/services/lean-runner/inspect-image-environment.mjs \
            | tee runner-image-evidence/offline-smoke.log

      - name: Run version conformance fixtures without network
        shell: bash
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
          LEAN_TOOLCHAIN: ${{ steps.profile.outputs.lean_toolchain }}
          MATHLIB_REVISION: ${{ steps.profile.outputs.mathlib_revision }}
        run: |
          set -euo pipefail
          docker run --rm --network=none --cpus=2 --memory=3g \
            --pids-limit=128 --tmpfs /tmp/proofweave:rw,nosuid,nodev,size=2g,mode=1777 \
            -e EXPECTED_NODE_VERSION="$EXPECTED_NODE_VERSION" \
            -e EXPECTED_LEAN_TOOLCHAIN="$LEAN_TOOLCHAIN" \
            -e EXPECTED_MATHLIB_REVISION="$MATHLIB_REVISION" \
            -e PROOFWEAVE_IMAGE_DIGEST="$FINAL_RUNNER_IMAGE" \
            --entrypoint node "$FINAL_RUNNER_IMAGE" \
            /opt/proofweave/services/lean-runner/run-image-conformance.mjs \
            | tee runner-image-evidence/conformance.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("runner-image-evidence/conformance.json", "utf8"));
            if (report.passed !== true) throw new Error("Image conformance fixtures did not pass.");
          '

      - name: Scan the exact final image for vulnerabilities
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
        run: |
          mkdir -p runner-image-evidence
          "$RUNNER_TEMP/proofweave-trivy/trivy" image --image-src docker \
            --scanners vuln --list-all-pkgs --timeout 20m --format json \
            --output runner-image-evidence/trivy.json "$FINAL_RUNNER_IMAGE"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const bytes = readFileSync("runner-image-evidence/trivy.json");
            const report = JSON.parse(bytes);
            if (!Array.isArray(report.Results) || report.Results.length === 0) throw new Error("Missing vulnerability scan results.");
            if (!report.Metadata?.RepoDigests?.includes(process.env.FINAL_RUNNER_IMAGE)) throw new Error("Scan does not bind the expected immutable image.");
            const vulnerabilities = report.Results.flatMap(result => result.Vulnerabilities ?? []);
            const blocking = vulnerabilities.filter(item => ["HIGH", "CRITICAL"].includes(item.Severity));
            const evidence = { sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, image: process.env.FINAL_RUNNER_IMAGE, scanner: "trivy 0.76.1", scanSha256: createHash("sha256").update(bytes).digest("hex"), vulnerabilityCount: vulnerabilities.length, blockingHighCritical: blocking.length, ignoredUnfixed: false };
            writeFileSync("runner-image-evidence/image-review.json", JSON.stringify(evidence, null, 2) + "\n");
            console.log(JSON.stringify(evidence));
            if (blocking.length) throw new Error("Image requires HIGH/CRITICAL vulnerability triage; production approval is blocked.");
          '

      - name: Inspect the exported trusted controller without publishing it
        shell: bash
        run: |
          set -euo pipefail
          CONTROLLER_EXPORT="$RUNNER_TEMP/proofweave-controller-export"
          node scripts/export-huggingface-runner-space.mjs "$CONTROLLER_EXPORT"
          docker buildx build --load --platform linux/amd64 \
            --tag proofweave-controller:inspection "$CONTROLLER_EXPORT"
          docker run --rm --network=none --cpus=1 --memory=512m --pids-limit=128 \
            --entrypoint node proofweave-controller:inspection --input-type=module -e '
              import assert from "node:assert/strict";
              import { existsSync } from "node:fs";
              import { createClient } from "@libsql/client";
              import { E2BSandboxContainerFactory } from "./services/lean-runner/e2b-sandbox-container.mjs";
              assert.equal(process.versions.node, "22.23.4");
              assert.equal(process.getuid(), 1000);
              assert.equal(existsSync("/usr/local/lib/node_modules/npm"), false);
              assert.equal(typeof E2BSandboxContainerFactory, "function");
              const client = createClient({ url: "file:/tmp/controller-smoke.sqlite" });
              try { assert.equal((await client.execute("SELECT 1 AS ok")).rows[0].ok, 1); }
              finally { client.close(); }
              console.log("controller-offline-smoke: Node, non-root SDK import and native SQLite passed");
            ' | tee runner-image-evidence/controller-smoke.log
          export CONTROLLER_IMAGE_ID="$(docker image inspect proofweave-controller:inspection --format '{{.Id}}')"
          "$RUNNER_TEMP/proofweave-trivy/trivy" image --image-src docker \
            --scanners vuln --list-all-pkgs --timeout 20m --format json \
            --output runner-image-evidence/controller-trivy.json proofweave-controller:inspection
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const bytes = readFileSync("runner-image-evidence/controller-trivy.json");
            const report = JSON.parse(bytes);
            if (!report.Results?.length || report.Metadata?.ImageID !== process.env.CONTROLLER_IMAGE_ID) throw new Error("Missing or mismatched controller scan evidence.");
            const blocking = report.Results.flatMap(result => result.Vulnerabilities ?? []).filter(item => ["HIGH", "CRITICAL"].includes(item.Severity));
            const evidence = { sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, imageId: process.env.CONTROLLER_IMAGE_ID, scanSha256: createHash("sha256").update(bytes).digest("hex"), blockingHighCritical: blocking.length, published: false };
            writeFileSync("runner-image-evidence/controller-review.json", JSON.stringify(evidence, null, 2) + "\n");
            console.log(JSON.stringify(evidence));
            if (blocking.length) throw new Error("Controller image requires HIGH/CRITICAL vulnerability triage.");
          '

      - name: Preserve image inspection evidence
        if: ${{ always() && (steps.runtime.outcome == 'success' || steps.runtime.outcome == 'failure' || steps.runner.outcome == 'success') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-image-review-${{ github.sha }}-${{ inputs.profile }}
          path: runner-image-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Attest the final Runner image in GitHub when supported
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.RUNNER_IMAGE_NAME }}
          subject-digest: ${{ steps.runner.outputs.digest }}
          push-to-registry: true

      - name: Record the private-repository attestation boundary
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "GitHub artifact attestations are unavailable for user-owned private repositories." >> "$GITHUB_STEP_SUMMARY"
          echo "The registry-attached BuildKit SBOM and provenance remain the published image evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable image coordinates
        id: coordinates
        env:
          FINAL_RUNNER_IMAGE: ${{ env.RUNNER_IMAGE_NAME }}@${{ steps.runner.outputs.digest }}
        run: |
          echo "runner_image=$FINAL_RUNNER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Proofweave reviewed Lean Runner" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "PROOFWEAVE_E2B_RUNNER_IMAGE=$FINAL_RUNNER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "leanToolchain=${{ steps.profile.outputs.lean_toolchain }}" >> "$GITHUB_STEP_SUMMARY"
          echo "mathlibRevision=${{ steps.profile.outputs.mathlib_revision }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
