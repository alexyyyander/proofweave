services:
  - type: web
    name: proofweave-trusted-runner
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node services/lean-runner/hosted-trusted-runner-main.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: RUNNER_EXECUTION_ENABLED
        value: "true"
      - key: PROOFWEAVE_RUNNER_PROVIDER
        value: e2b
      - key: RUNNER_CONSUMER_ID
        value: runner:render-free-alpha
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: RUNNER_RESULT_PRIVATE_KEY_JWK
        sync: false
      - key: PROOFWEAVE_RUNNER_WAKE_TOKEN
        sync: false
      - key: RUNNER_RESULT_KEY_ID
        sync: false
      - key: RUNNER_APPROVED_IMAGES_JSON
        value: '[{"imageDigest":"ghcr.io/alexyyyander/proofweave-lean-runner@sha256:ca896ab3945034079ab7f7cedfc7c5e665a601299c1745b51a72736420957393","leanToolchain":"leanprover/lean4:v4.31.0","mathlibRevision":"9a9483a92959bc92bd6a60176dd1fe597298c1f8"}]'
      - key: RUNNER_CONTROL_PLANE_ISSUER_KEYS_JSON
        sync: false
      - key: PROOFWEAVE_E2B_TEMPLATE_ID
        value: cbfjgbsrgtku0c7sliu5:root-dotfiles-20260727g
      - key: PROOFWEAVE_E2B_TEMPLATE_BUILD_ID
        value: c07bbdf8-db5f-4464-911a-89ad0e564399
      - key: PROOFWEAVE_E2B_RUNNER_IMAGE
        value: ghcr.io/alexyyyander/proofweave-lean-runner@sha256:ca896ab3945034079ab7f7cedfc7c5e665a601299c1745b51a72736420957393
      - key: PROOFWEAVE_E2B_CPU
        value: "2"
      - key: PROOFWEAVE_E2B_MEMORY_MB
        value: "8192"
      - key: PROOFWEAVE_E2B_TIMEOUT_MS
        value: "1260000"
      - key: PROOFWEAVE_E2B_STARTUP_TIMEOUT_MS
        value: "120000"
      - key: RUNNER_EXECUTION_POLL_MILLISECONDS
        value: "10000"
      - key: PROOFWEAVE_E2B_RESOURCE_POLICY_REVIEWED
        value: "true"
      - key: PROOFWEAVE_RUNNER_REVISION
        sync: false
